{% extends "base.html" %}
{% block title %}Adressen – Zeitungsarchiv{% endblock %}
{% block head %}
<link rel="stylesheet" href="/static/leaflet/leaflet.min.css">
<style>
  .tab-bar { display: flex; gap: 0; margin-bottom: 1rem; border-bottom: 2px solid #ccc; }
  .tab-btn {
    padding: .5rem 1.4rem; border: none; background: none; cursor: pointer;
    font-size: 1rem; border-bottom: 3px solid transparent; margin-bottom: -2px;
    color: #555;
  }
  .tab-btn.active { border-bottom-color: #2563eb; color: #2563eb; font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  #map { height: 520px; border-radius: 6px; border: 1px solid #ddd; }
  .leaflet-popup-content strong { display: block; margin-bottom: .3rem; }
  .leaflet-popup-content .rating-badge {
    display: inline-block; padding: .1rem .5rem; border-radius: 4px;
    font-size: .8rem; background: #e5e7eb; margin-top: .3rem;
  }
  .leaflet-popup-content a { color: #2563eb; }
</style>
{% endblock %}
{% block content %}
<section class="search-box">
  <form hx-get="/places" hx-target="#places-results"
        hx-trigger="submit, input[target.name=='q'] delay:400ms, change[target.tagName=='SELECT'] delay:100ms">
    <div class="search-row">
      <input type="text" name="q" value="{{ q }}" placeholder="Name, Ort, Adresse…" autofocus>
      <button type="submit">Suchen</button>
    </div>
    <div class="filter-row">
      <select name="country"
              hx-get="/places/cities" hx-target="#city-select" hx-include="[name='country']"
              hx-trigger="change">
        <option value="">Alle Länder</option>
        <option value="__none__" {% if country == '__none__' %}selected{% endif %}>(kein Land)</option>
        {% for c in countries %}
          <option value="{{ c }}" {% if c == country %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
      <select name="city" id="city-select">
        <option value="">Alle Orte</option>
        {% for c in cities %}
          <option value="{{ c }}" {% if c == city %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
      <select name="state" id="state-select">
        <option value="">Alle Bundesländer</option>
        {% for s in states %}
          <option value="{{ s }}" {% if s == state %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
      <select name="is_active">
        <option value="active"   {% if is_active == 'active'   %}selected{% endif %}>Aktiv</option>
        <option value="all"      {% if is_active == 'all'      %}selected{% endif %}>Alle</option>
        <option value="inactive" {% if is_active == 'inactive' %}selected{% endif %}>Inaktiv</option>
      </select>
      <select name="geocoded">
        <option value="">Alle</option>
        <option value="geocoded" {% if geocoded == 'geocoded' %}selected{% endif %}>Geocodiert</option>
        <option value="not_geocoded" {% if geocoded == 'not_geocoded' %}selected{% endif %}>Nicht geocodiert</option>
      </select>
    </div>
  </form>
</section>

<div style="margin-bottom:.75rem;text-align:right">
  <button hx-get="/places/new-form"
          hx-target="#manual-place-form"
          hx-swap="innerHTML"
          class="btn">+ Ort hinzufügen</button>
</div>
<div id="manual-place-form"></div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('list', this)">Liste</button>
  <button class="tab-btn" onclick="switchTab('map', this)">Karte</button>
</div>

<div id="tab-list" class="tab-panel active">
  <div id="places-results">
    {% include "places_results.html" %}
  </div>
</div>

<div id="tab-map" class="tab-panel">
  <div id="map"></div>
</div>

<script src="/static/leaflet/leaflet.min.js"></script>
<script>
// Fix Leaflet default icon paths for locally bundled assets
delete L.Icon.Default.prototype._getIconUrl;
L.Icon.Default.mergeOptions({
  iconUrl:      '/static/leaflet/images/marker-icon.png',
  iconRetinaUrl:'/static/leaflet/images/marker-icon-2x.png',
  shadowUrl:    '/static/leaflet/images/marker-shadow.png',
});

let mapInitialized = false;
let leafletMap = null;
let userHasNavigated = false;
const MAP_STORAGE_KEY = 'places_map_state';

function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'map' && !mapInitialized) {
    initMap();
  }
}

let mapMarkers = [];

function getFilterParams() {
  const form = document.querySelector('form[hx-get="/places"]');
  return new URLSearchParams(new FormData(form)).toString();
}

function saveMapState() {
  const c = leafletMap.getCenter();
  sessionStorage.setItem(MAP_STORAGE_KEY, JSON.stringify({
    zoom: leafletMap.getZoom(), lat: c.lat, lng: c.lng
  }));
}

function loadMapMarkers() {
  if (!mapInitialized) return;
  mapMarkers.forEach(m => m.remove());
  mapMarkers = [];

  fetch('/places/map-data?' + getFilterParams())
    .then(r => r.json())
    .then(rows => {
      if (!rows.length) return;
      // Group by canonical place id (one marker per physical location)
      const byPlace = {};
      rows.forEach(r => {
        if (!byPlace[r.id]) byPlace[r.id] = { ...r, articles: [] };
        byPlace[r.id].articles.push({
          article_id:  r.article_id,
          headline:    r.headline,
          description: r.description,
          rating:      r.rating,
        });
      });
      const bounds = [];
      Object.values(byPlace).forEach(p => {
        const marker = L.marker([p.lat, p.lng]).addTo(leafletMap);
        const articleLinks = p.articles.map(a => {
          const ratingBadge = a.rating
            ? ` <span class="rating-badge">${a.rating}</span>` : '';
          const desc = a.description
            ? `<p style="margin:.2rem 0;font-size:.85rem">${a.description.substring(0, 100)}${a.description.length > 100 ? '…' : ''}</p>` : '';
          return `<div style="margin-top:.4rem">${desc}<a href="/articles/${a.article_id}">${a.headline || '#' + a.article_id}</a>${ratingBadge}</div>`;
        }).join('');
        marker.bindPopup(
          `<strong>${p.name || '?'}</strong>` +
          (p.city ? `<div style="color:#666;font-size:.85rem">${p.city}</div>` : '') +
          articleLinks
        );
        bounds.push([p.lat, p.lng]);
        mapMarkers.push(marker);
      });
      // Only auto-fit if user hasn't manually navigated yet
      if (bounds.length && !userHasNavigated) {
        leafletMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
      }
    });
}

// Map initializes lazily on first tab switch, not on page load

function initMap() {
  mapInitialized = true;
  const saved = sessionStorage.getItem(MAP_STORAGE_KEY);
  const savedView = saved ? JSON.parse(saved) : null;
  leafletMap = L.map('map');
  if (savedView) {
    leafletMap.setView([savedView.lat, savedView.lng], savedView.zoom);
    userHasNavigated = true;
  } else {
    leafletMap.setView([47.5, 14.0], 7);
  }
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  }).addTo(leafletMap);
  // Save position after any user pan/zoom (also captures fitBounds result on first open)
  leafletMap.on('moveend zoomend', function() {
    saveMapState();
    userHasNavigated = true;
  });
  loadMapMarkers();
}

// Reload map markers after HTMX settles the places results
document.addEventListener('htmx:afterSettle', function(e) {
  if (e.detail.target && e.detail.target.id === 'places-results') {
    loadMapMarkers();
  }
});
</script>
{% endblock %}
